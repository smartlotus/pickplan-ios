# GitHub Actions workflow template for building an unsigned native iOS/iPadOS .ipa
# Copy this file to `.github/workflows/build-unsigned-ipa.yml` via GitHub Web UI
# or after refreshing CLI auth with: gh auth refresh -h github.com -s workflow

name: Build Unsigned Pickplan iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version
          swift --version

      - name: Run PickPlanCore unit tests
        run: |
          chmod +x scripts/run_tests.sh
          ./scripts/run_tests.sh || swift test

      - name: Build unsigned iOS & iPadOS IPA
        run: |
          chmod +x scripts/build_unsigned_ipa.sh
          ./scripts/build_unsigned_ipa.sh

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PickPlan-Unsigned-IPA
          path: build/PickPlan-Unsigned.ipa
          retention-days: 30
